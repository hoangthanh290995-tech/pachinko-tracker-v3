name: Pachinko live collector

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Call live collector
        env:
          API_URL: https://pachinko-data-api.onrender.com/api/data
        run: |
          set -e
          curl --fail --silent --show-error --retry 3 --max-time 90 "$API_URL?t=$(date +%s)" -o response.json
          python - <<'PY'
          import json
          with open('response.json',encoding='utf-8') as f: d=json.load(f)
          print('ok=',d.get('ok'),'liveOk=',d.get('liveOk'),'machines=',len(d.get('machines',[])))
          if not d.get('ok') or not d.get('liveOk'): raise SystemExit("No live P'sCUBE data")
          PY

      - name: Save live history
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          with open('response.json',encoding='utf-8') as f: d=json.load(f)
          try:
              with open('data/live-history.json',encoding='utf-8') as f: store=json.load(f)
          except Exception: store={'updated':None,'snapshots':[]}
          snaps=store.get('snapshots',[]) if isinstance(store.get('snapshots'),list) else []
          now=datetime.now(timezone.utc).isoformat(); stamp=d.get('updated') or now
          for m in d.get('machines',[]):
              ds=m.get('detailStats') or {}; live=m.get('live') or {}
              snaps.append({
                'id':str(m.get('id')),'timestamp':stamp,'collectedAt':now,
                'days':(m.get('days') or live.get('days') or [])[:30],
                'big':ds.get('big'),'continuation':ds.get('continuation'),'probability':ds.get('probability'),
                'start':ds.get('start'),'lastStart':ds.get('lastStart'),'maxPayout':ds.get('maxPayout'),
                'graphAssets':(m.get('graphAssets') or live.get('graphAssets') or [])[:20],
                'numbers':(m.get('numbers') or live.get('numbers') or [])[:40]
              })
          with open('data/live-history.json','w',encoding='utf-8') as f:
              json.dump({'updated':stamp,'snapshots':snaps[-20000:]},f,ensure_ascii=False,separators=(',',':'))
          PY

      - name: Commit snapshot history
        run: |
          git config user.name "pachinko-collector[bot]"
          git config user.email "pachinko-collector[bot]@users.noreply.github.com"
          git add data/live-history.json
          if git diff --cached --quiet; then echo "No new snapshot"; else git commit -m "Update pachinko live history"; git push; fi
